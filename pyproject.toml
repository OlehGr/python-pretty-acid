[project]
name = "python-pretty-acid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.1",
    "asyncpg>=0.31.0",
    "dishka>=1.7.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.14",
    "sqlalchemy>=2.0.45",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-v"]
testpaths = [
    "app/tests/*",
]

[tool.ruff]
exclude = [
    "**/migrations",
    "app/tests/*"
]


[tool.ruff.lint]
select = ['ALL']
ignore = [
    "EM",
    "FBT",
    "TRY003",
    "D1",
    "D203",
    "D213",
    "G004",
    "FA",
    "COM812",
    "ISC001",
    "PLR0913",
    "A005",
    "S104",
    "DTZ005",
    "B008",
    "B904",
    "UP007",
    "RUF006",
    'PGH003',
    "C901",
    "PLR0912",
    "RUF001",
    "DTZ003",
    "BLE001",
    "PLR0915",
    "PLR0911",
    "ANN003",
    "ANN002",
    "ANN001",
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]


[tool.ty.src]
exclude = [
    "**/migrations",
]

[dependency-groups]
dev = [
    "ty>=0.0.18",
    "ruff"
]
